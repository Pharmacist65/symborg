name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Contextual whisper prototype
        working-directory: prototypes/contextual-whisper-demo
        run: PYTHONPATH=src python -m unittest discover tests -v

      - name: Output router prototype
        working-directory: prototypes/output-router-demo
        run: PYTHONPATH=src python -m unittest discover tests -v

      - name: Integrated live demo
        working-directory: prototypes/symborg-live-demo
        run: python -m unittest discover tests -v
