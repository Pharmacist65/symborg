<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SYMBORG</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#07090c">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
  :root {
    --bg: #07090c; --fg: #e8ecf1; --dim: #6b7683; --line: #171c23;
    --ear: #5eead4; --screen: #93c5fd; --room: #fbbf24; --held: #4b5563;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 400 17px/1.5 ui-rounded, -apple-system, "Segoe UI", system-ui, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    padding: 18px 20px 14px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--held);
         transition: background .3s, box-shadow .3s; flex: none; }
  #dot.on { background: var(--ear); box-shadow: 0 0 0 5px rgba(94,234,212,.13); }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .16em; margin: 0; flex: 1; }
  #stats { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
           text-align: right; line-height: 1.35; }
  #stats b { display: block; color: var(--fg); font-weight: 500; }
  #warn {
    margin: 0 20px 12px; padding: 10px 13px; border-radius: 10px; font-size: 13px;
    background: rgba(251,191,36,.09); border-left: 3px solid var(--room); display: none;
  }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  #hearing {
    min-height: 34px; color: var(--dim); font-size: 15px; font-style: italic;
    margin-bottom: 18px;
  }
  .turn { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .said-by-them { color: var(--dim); font-size: 15px; }
  .whisper {
    margin-top: 9px; padding: 11px 14px; border-radius: 12px;
    background: rgba(94,234,212,.07); border-left: 3px solid var(--ear);
    font-size: 17px; line-height: 1.4;
  }
  .whisper.screen { background: rgba(147,197,253,.07); border-left-color: var(--screen); }
  .whisper.room   { background: rgba(251,191,36,.07);  border-left-color: var(--room); }
  .tag { display: block; font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
         color: var(--dim); margin-bottom: 5px; }
  .kept { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .kept span { display: block; padding-left: 15px; text-indent: -15px; }
  .held { margin-top: 8px; font-size: 12px; color: var(--held); }

  #empty { color: var(--dim); font-size: 15px; line-height: 1.7; }
  #empty b { color: var(--fg); font-weight: 600; }

  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  #start {
    width: 100%; padding: 17px; font: inherit; font-weight: 600; border: 0;
    border-radius: 14px; background: var(--ear); color: #04211c;
  }
  #start.on { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  #toggles { display: flex; gap: 8px; margin-top: 12px; }
  #toggles button {
    flex: 1; padding: 11px 4px; font: inherit; font-size: 12px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
  }
  #toggles button.on { color: var(--fg); border-color: var(--dim); }
  #note { margin-top: 11px; font-size: 12px; color: var(--held); text-align: center; }
  #camera { display: none; }
  #shoot {
    flex: 1; padding: 15px; font: inherit; font-size: 15px;
    border-radius: 12px; border: 1px solid var(--line); background: transparent;
    color: var(--fg);
  }
  #row { display: flex; gap: 8px; margin-top: 8px; }
  #talk {
    flex: 1; padding: 15px; font: inherit; font-size: 15px; font-weight: 600;
    border-radius: 12px; border: 1px solid var(--ear); background: transparent;
    color: var(--ear); touch-action: none; user-select: none;
  }
  #talk.holding { background: var(--ear); color: #04211c; }
  .addressed .said-by-them { color: var(--fg); }
  .addressed .said-by-them::before {
    content: 'sen: '; color: var(--ear); font-size: 12px; letter-spacing: .1em;
  }
  .sighting { margin-top: 9px; font-size: 14px; color: var(--dim); }
  .sighting ul { margin: 6px 0 0; padding-left: 18px; }
  .sighting li { margin: 2px 0; }
  .warn {
    margin-top: 9px; padding: 11px 14px; border-radius: 12px; font-size: 16px;
    background: rgba(251,191,36,.08); border-left: 3px solid var(--room);
  }
</style>

<header>
  <div id="dot"></div>
  <h1>SYMBORG</h1>
  <div id="stats"></div>
</header>

<div id="warn"></div>
<main>
  <div id="hearing"></div>
  <div id="empty">
    Çoğu zaman <b>hiçbir şey söylemez</b>. Duyduğunu tutar, sen ararken geri verir,
    yanlış hatırlarsan düzeltir. Gerisi sessizliktir.
  </div>
  <div id="turns"></div>
</main>

<footer>
  <button id="start">Dinlemeye başla</button>
  <div id="toggles">
    <button data-key="earpiece">kulaklık</button>
    <button data-key="others_present">yanımda biri var</button>
    <button data-key="screen_visible">ekran görünür</button>
  </div>
  <div id="row">
    <button id="talk">Bas ve konuş</button>
    <button id="shoot">Bir şeye bak</button>
  </div>
  <input type="file" id="camera" accept="image/*" capture="environment">
  <div id="note"></div>
</footer>

<script type="module">
import { Gate } from '/vad.js';

const RATE = 24000, SEND_MS = 240;
const dot = document.getElementById('dot'), stats = document.getElementById('stats');
const hearing = document.getElementById('hearing'), turns = document.getElementById('turns');
const empty = document.getElementById('empty'), start = document.getElementById('start');
const note = document.getElementById('note'), warn = document.getElementById('warn');
const shoot = document.getElementById('shoot'), camera = document.getElementById('camera');
const talk = document.getElementById('talk');

let ctx, node, media, pending = [], running = false, seen = 0, situation = {};
let gate = new Gate(RATE), wakeLock = null, pendingQuestion = '';
let sentBytes = 0, heldBytes = 0, failures = 0;

const TAG = { ear: 'kulağa', screen: 'ekranda', room: 'sesli' };

function say(message) { warn.textContent = message; warn.style.display = message ? 'block' : 'none'; }

// -- events, with reconnect. A phone on a chest loses wifi walking between rooms, and a
// dead event stream looks exactly like a dead device.
let events;
function listen() {
  events = new EventSource('/events');
  events.onmessage = e => {
    failures = 0;
    const s = JSON.parse(e.data);
    situation = s.situation || {};
    for (const b of document.querySelectorAll('#toggles button'))
      b.classList.toggle('on', !!situation[b.dataset.key]);
    hearing.textContent = s.heard || '';
    render_stats(s);
    if (s.log.length) empty.style.display = 'none';
    for (const entry of s.log.slice(seen)) render(entry);
    seen = s.log.length;
    talk.classList.toggle('holding', !!s.addressing);
  };
  events.onerror = () => {
    events.close();
    failures++;
    say(failures > 2 ? 'Bağlantı koptu, yeniden deneniyor…' : '');
    setTimeout(listen, Math.min(1000 * failures, 8000));
  };
}
listen();

function render_stats(s) {
  const total = sentBytes + heldBytes;
  const passed = total ? sentBytes / total : 0;
  const lines = [];
  if (s.turns) lines.push(`${s.turns} tur · ${Math.round(s.silence * 100)}% sessiz`);
  if (s.remembered) lines.push(`${s.remembered} kayıt`);
  // What could have stayed on the device. The number that decides whether a local model
  // is worth having, shown while it is being earned rather than estimated afterwards.
  if (s.tiers?.near_calls || s.tiers?.far_calls)
    lines.push(`${Math.round(s.tiers.near_share * 100)}% yakın · ${s.tiers.far_calls} uzak`);
  stats.innerHTML = (running ? `<b>${Math.round(passed * 100)}% ses gitti</b>` : '')
    + lines.join(' · ');
}

function render(entry) {
  const el = document.createElement('div');
  el.className = entry.addressed ? 'turn addressed' : 'turn';
  const them = document.createElement('div');
  them.className = 'said-by-them';
  them.textContent = entry.transcript;
  el.append(them);

  if (entry.said && entry.channel !== 'none') {
    const w = document.createElement('div');
    w.className = 'whisper ' + entry.channel;
    w.innerHTML = `<span class="tag">${TAG[entry.channel] || entry.channel}</span>`;
    w.append(document.createTextNode(entry.said));
    el.append(w);
    if (entry.audio) new Audio(entry.audio).play().catch(() => {});
    if (entry.want === 'look' && !entry.sighting) {
      pendingQuestion = entry.transcript;
      setTimeout(() => camera.click(), 400);
    }
  } else if (entry.held) {
    const h = document.createElement('div');
    h.className = 'held';
    h.textContent = entry.held === 'would_tell_the_room'
      ? 'söyleyeceği vardı — odaya duyurmamak için sustu'
      : entry.held === 'would_interrupt' ? 'söyleyeceği vardı — sözünü kesmemek için sustu'
      : 'sustu';
    el.append(h);
  }

  if (entry.sighting) {
    const g = entry.sighting;
    const box = document.createElement('div');
    box.className = g.irreversible ? 'warn' : 'sighting';
    box.style.display = 'block';
    box.textContent = g.whisper || g.seen;
    el.append(box);
    const detail = document.createElement('div');
    detail.className = 'sighting';
    detail.textContent = g.seen;
    if (g.could_be?.length) {
      const ul = document.createElement('ul');
      for (const c of g.could_be) {
        const li = document.createElement('li'); li.textContent = c; ul.append(li);
      }
      detail.append(ul);
    }
    if (g.missing) {
      const mm = document.createElement('div');
      mm.style.marginTop = '6px';
      mm.textContent = 'fotoğrafta olmayan: ' + g.missing;
      detail.append(mm);
    }
    el.append(detail);
  }

  if (entry.remembered?.length) {
    const k = document.createElement('div');
    k.className = 'kept';
    for (const r of entry.remembered) {
      const line = document.createElement('span');
      line.textContent = '· ' + r;
      k.append(line);
    }
    el.append(k);
  }
  turns.prepend(el);
}

for (const b of document.querySelectorAll('#toggles button')) {
  b.onclick = () => {
    const next = !b.classList.contains('on');
    b.classList.toggle('on', next);
    fetch('/situation', { method: 'POST', body: JSON.stringify({ [b.dataset.key]: next }) });
  };
}

const hold = e => {
  e.preventDefault();
  if (!running) { say('Önce dinlemeye başla.'); return; }
  talk.classList.add('holding');
  fetch('/address', { method: 'POST', body: '{}' });
};
const release = () => talk.classList.remove('holding');
talk.addEventListener('pointerdown', hold);
talk.addEventListener('pointerup', release);
talk.addEventListener('pointercancel', release);

shoot.onclick = () => camera.click();

camera.onchange = async () => {
  const file = camera.files?.[0];
  if (!file) return;
  camera.value = '';
  shoot.textContent = 'bakıyor…';
  shoot.disabled = true;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    if (pendingQuestion) {
      await fetch('/asked', { method: 'POST', body: JSON.stringify({
        said: pendingQuestion, image: btoa(binary) }) });
      pendingQuestion = '';
    } else {
      const question = prompt('Ne sormak istersin?', 'Bu ne?');
      if (question === null) return;
      await fetch('/look', { method: 'POST', body: JSON.stringify({
        image: btoa(binary), question, mime: file.type || 'image/jpeg' }) });
    }
    empty.style.display = 'none';
  } catch {
    say('Fotoğraf gönderilemedi.');
  } finally {
    shoot.textContent = 'Bir şeye bak';
    shoot.disabled = false;
  }
};

// -- the screen must not sleep, or capture stops with it.
async function keepAwake() {
  try {
    wakeLock = await navigator.wakeLock?.request('screen');
    wakeLock?.addEventListener('release', () => { if (running) setTimeout(keepAwake, 500); });
  } catch { /* not supported, or refused; the page still works while visible */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && !wakeLock) keepAwake();
});

start.onclick = async () => {
  if (running) return stop();
  if (!navigator.mediaDevices?.getUserMedia) {
    say('Mikrofona erişilemiyor. Adres localhost değilse HTTPS gerekir.');
    return;
  }
  try {
    media = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true,
               autoGainControl: true } });
  } catch {
    say('Mikrofon izni verilmedi.');
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
  await ctx.resume();
  try {
    await ctx.audioWorklet.addModule('/capture.js');
    node = new AudioWorkletNode(ctx, 'capture');
    node.port.onmessage = e => pending.push(new Int16Array(e.data));
    ctx.createMediaStreamSource(media).connect(node);
  } catch {
    // Older WebView, no worklet. The main-thread path stutters but still works.
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = e => {
      const input = e.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const v = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }
      pending.push(pcm);
    };
    ctx.createMediaStreamSource(media).connect(node);
    node.connect(ctx.destination);
  }

  gate.reset();
  sentBytes = heldBytes = 0;
  running = true;
  start.textContent = 'Dinliyor — durdurmak için dokun';
  start.classList.add('on');
  dot.classList.add('on');
  say(ctx.sampleRate === RATE ? '' :
      `Tarayıcı ${ctx.sampleRate} Hz veriyor, ${RATE} bekleniyor.`);
  keepAwake();
  pump();
};

function stop() {
  running = false;
  node?.disconnect(); media?.getTracks().forEach(t => t.stop()); ctx?.close();
  wakeLock?.release?.(); wakeLock = null;
  start.textContent = 'Dinlemeye başla';
  start.classList.remove('on'); dot.classList.remove('on');
}

async function pump() {
  while (running) {
    await new Promise(r => setTimeout(r, SEND_MS));
    if (!pending.length) continue;
    const frames = pending; pending = [];

    // The gate runs here, so silence never leaves the phone at all — it costs no data
    // and no transcription, and a room is mostly silent.
    const passing = [];
    for (const frame of frames) {
      const out = gate.filter(frame);
      if (out) { passing.push(out); sentBytes += out.length * 2; }
      else heldBytes += frame.length * 2;
    }
    if (!passing.length) continue;

    let total = 0;
    for (const p of passing) total += p.length;
    const merged = new Int16Array(total);
    let at = 0;
    for (const p of passing) { merged.set(p, at); at += p.length; }
    try {
      await fetch('/audio', { method: 'POST', body: merged.buffer });
    } catch { /* a dropped block beats a stalled page */ }
  }
}
</script>
